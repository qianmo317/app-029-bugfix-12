server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    server_tokens off;

    # gzip 压缩（字体不压缩：已是 gzip 友好格式，且 nginx 默认不含 ttf/otf）
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/xml image/svg+xml;

    # 健康检查（HEALTHCHECK / 反向代理探针）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite 构建产物：文件名带内容哈希 -> 强缓存 immutable
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 本地字体：文件名不带哈希，用 30 天缓存；必须能断网可用（本地打包，无外网请求）
    location /fonts/ {
        types {
            font/ttf  ttf;
            font/otf  otf;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # 入口 HTML 不缓存，保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # SPA 回退：/edit/:id、/light/:id 等前端路由直接刷新也能打开
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
}